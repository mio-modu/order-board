<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order Together — 말하면 모이는 주문</title>
<meta name="theme-color" content="#F7F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주문판">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23B4472F'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%23FFF3EC' font-family='serif'%3EO%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/json,{"name":"Order Together","short_name":"주문판","display":"standalone","start_url":".","background_color":"%23F7F4EF","theme_color":"%23F7F4EF"}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- color ---- */
    --bg:#F7F4EF;
    --surface:#FFFFFF;
    --surface-2:#FBFAF7;
    --ink:#1A1815;
    --ink-deep:#201C17;          /* 상태 카드 / 전광판 버튼 */
    --ink-soft:#6B655C;
    --ink-dim:#9A9186;           /* 어두운 면 위 라벨 */
    --line:rgba(26,24,21,.08);
    --line-strong:rgba(26,24,21,.18);
    --accent:#B4472F;
    --accent-lit:#D66A4E;
    --accent-deep:#973720;
    --accent-fg:#FFF3EC;
    --accent-2:#2F4739;
    --gold:#C9A227;

    /* ---- spacing (4px scale) ---- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;

    /* ---- radius ---- */
    --r-sm:10px; --r-md:16px; --r-lg:24px;

    /* ---- elevation (2 steps only) ---- */
    --shadow-card:0 8px 24px -16px rgba(26,24,21,.40);
    --shadow-float:0 -12px 40px -12px rgba(26,24,21,.40);

    /* ---- type ---- */
    --font-sans:'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    --font-display:'Fraunces', 'Instrument Serif', Georgia, serif;

    /* ---- motion ---- */
    --ease-out:cubic-bezier(.22,.61,.36,1);
    --dur-fast:140ms; --dur-mid:200ms; --dur-slow:250ms;

    /* ---- board ---- */
    --board-cyan:#7FE3E8;
    --board-amber:#F4B740;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-sans);
    font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:var(--s8);
  }
  /* 종이 질감 — 시안의 noise 오버레이 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    opacity:.03;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
  }
  button,input{font-family:inherit;}
  .num{
    font-family:var(--font-display);font-weight:400;
    font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1;
  }

  .wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:var(--s6) 26px var(--s2);}

  /* ============ header ============ */
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);}
  header .title{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1;letter-spacing:-.01em;}
  header .date{font-size:13px;color:var(--ink-soft);margin-top:6px;}
  .reset-btn{
    flex-shrink:0;border:1px solid var(--line-strong);background:transparent;color:var(--ink);
    font-size:13px;font-weight:500;min-height:44px;padding:0 15px;border-radius:999px;
    transition:border-color var(--dur-fast) ease,color var(--dur-fast) ease;
  }
  .reset-btn:active{border-color:var(--accent);color:var(--accent);}

  /* ============ status cards (가운데 정렬) ============ */
  .counter-board{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin-top:26px;}
  .counter{
    background:var(--ink-deep);border-radius:20px;padding:20px 18px;text-align:center;
    border:1.5px solid transparent;font-family:inherit;width:100%;display:block;
    transition:border-color var(--dur-mid) ease;
  }
  .counter.tappable{cursor:pointer;}
  .counter.full{border-color:var(--gold);}
  .counter .lbl{font-size:12px;color:var(--ink-dim);letter-spacing:.02em;}
  .counter-sub{font-size:11.5px;color:var(--ink-dim);margin-top:8px;min-height:16px;letter-spacing:.01em;}
  .counter.full .counter-sub{color:var(--gold);}
  .counter .goal{font-family:var(--font-display);font-size:26px;color:var(--ink-dim);margin-left:6px;}
  .counter .num{
    display:flex;align-items:baseline;justify-content:center;
    font-size:40px;line-height:1;color:var(--gold);margin-top:10px;
  }
  .counter .roll{display:block;overflow:hidden;height:1em;}
  .counter .roll > span{display:block;}
  .counter .roll > span.rolling{animation:numRoll var(--dur-mid) var(--ease-out);}
  @keyframes numRoll{from{transform:translateY(70%);opacity:0;}to{transform:none;opacity:1;}}
  .counter .unit{font-family:var(--font-sans);font-size:16px;color:var(--ink-soft);margin-left:var(--s1);}

  /* ============ mic ============ */
  .mic-stage{display:flex;flex-direction:column;align-items:center;padding:var(--s8) 0 0;}
  .mic-holder{position:relative;width:140px;height:140px;display:grid;place-items:center;}
  .ring{
    position:absolute;width:104px;height:104px;border-radius:50%;
    border:2px solid rgba(180,71,47,.5);opacity:0;pointer-events:none;
  }
  .mic-holder.listening .ring{animation:ripple 2.4s var(--ease-out) infinite;}
  .mic-holder.listening .ring.r2{animation-delay:1.2s;}
  @keyframes ripple{0%{transform:scale(1);opacity:.45;}100%{transform:scale(2.4);opacity:0;}}

  .mic-btn{
    position:relative;width:140px;height:140px;border-radius:50%;border:none;color:var(--accent-fg);
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 38% 30%, var(--accent-lit), var(--accent) 55%, var(--accent-deep));
    box-shadow:0 18px 40px -12px rgba(180,71,47,.55), 0 0 0 1px rgba(180,71,47,.2);
    animation:breathe 4s ease-in-out infinite;
    transition:width var(--dur-slow) var(--ease-out), height var(--dur-slow) var(--ease-out), transform 90ms ease;
  }
  .mic-btn:active{transform:scale(.97);}
  .mic-holder.listening .mic-btn{
    width:104px;height:104px;animation:none;
    box-shadow:0 12px 30px -10px rgba(180,71,47,.55);
  }
  .mic-btn svg{width:38px;height:52px;transition:width var(--dur-slow) var(--ease-out),height var(--dur-slow) var(--ease-out);}
  .mic-holder.listening .mic-btn svg{width:30px;height:42px;}
  @keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}

  .mic-status{
    margin-top:26px;font-size:17px;font-weight:600;letter-spacing:-.01em;
    min-height:24px;text-align:center;transition:opacity var(--dur-fast) ease;
  }
  .mic-sub{
    font-size:13px;color:var(--ink-soft);margin-top:5px;text-align:center;
    min-height:19px;transition:opacity var(--dur-fast) ease;
  }
  .fade-out{opacity:0;}

  /* ============ buttons ============ */
  .btn{
    border:none;border-radius:14px;min-height:48px;padding:0 var(--s4);
    font-size:13px;font-weight:500;letter-spacing:-.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:opacity var(--dur-fast) ease,transform 90ms ease;
  }
  .btn:active{transform:scale(.985);opacity:.9;}
  .btn-ghost{border:1px solid var(--line-strong);background:transparent;color:var(--ink-soft);}
  .btn-primary{background:var(--accent-2);color:#F3F1EC;flex:1;}
  .btn-danger{background:var(--accent);color:var(--accent-fg);flex:1;}
  .btn-check svg{width:20px;height:20px;}

  .action-bar{display:flex;gap:10px;width:100%;margin-top:26px;}
  .action-bar .btn-ghost{flex:0 0 auto;width:88px;}
  .btn-board{
    width:100%;margin-top:10px;border:none;background:var(--ink-deep);color:var(--bg);
    font-size:15px;font-weight:600;min-height:54px;border-radius:var(--r-md);
  }

  /* ============ confirm card ============ */
  .confirm-card{
    width:100%;background:var(--surface);border-radius:22px;padding:var(--s4);
    margin-top:var(--s4);box-shadow:var(--shadow-card);
  }
  .confirm-card .hint{font-size:12px;color:var(--ink-soft);margin-bottom:var(--s3);}
  .confirm-boxes{display:flex;gap:10px;}
  .confirm-box{flex:1;min-width:0;}
  .confirm-box label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:7px;}
  .field{
    width:100%;border:1px solid var(--line-strong);border-radius:14px;padding:15px 16px;
    font-size:16px;color:var(--ink);background:var(--surface-2);
  }
  .field:focus{outline:none;border-color:rgba(180,71,47,.6);box-shadow:0 0 0 3px rgba(180,71,47,.12);}
  .confirm-actions{display:flex;gap:10px;margin-top:var(--s4);}

  /* ============ list ============ */
  .section-lbl{
    font-size:12px;color:var(--ink-soft);letter-spacing:.02em;
    margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;
  }
  .toggle-view{
    background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:500;
    min-height:44px;padding:0 var(--s2);margin-right:calc(var(--s2) * -1);
  }

  .order-card{background:var(--surface);border-radius:22px;padding:var(--s2) 6px;box-shadow:var(--shadow-card);}
  .o-row{display:flex;align-items:center;gap:var(--s3);padding:14px;}
  .o-row + .o-row{border-top:1px solid var(--line);}
  .o-main{flex:1;min-width:0;}
  .o-name{font-size:16px;color:var(--ink);font-weight:500;letter-spacing:-.01em;}
  .o-who{font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.7;}
  .o-qty{
    width:34px;height:34px;flex-shrink:0;border-radius:50%;
    background:var(--accent);color:var(--accent-fg);font-size:17px;
    display:flex;align-items:center;justify-content:center;
  }
  .o-row.row-in{animation:rowIn var(--dur-slow) var(--ease-out) both;}
  @keyframes rowIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:none;}}
  .removing{animation:rowOut 180ms ease-in forwards;}
  @keyframes rowOut{to{opacity:0;transform:translateX(-14px);}}

  /* 주문자 칩 — 시안의 "성진 · 신성" 텍스트 톤을 유지하면서 개별 삭제 가능 */
  .name-chip{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;}
  .name-chip + .name-chip::before{content:"·";margin:0 5px 0 2px;color:var(--line-strong);}
  .name-chip button{
    position:relative;background:transparent;border:none;color:var(--line-strong);
    width:16px;height:16px;font-size:10px;line-height:1;display:grid;place-items:center;
    border-radius:50%;transition:color var(--dur-fast) ease;
  }
  .name-chip button:active{color:var(--accent);}
  .name-chip button::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%);}

  .empty{
    border:1px dashed rgba(26,24,21,.22);border-radius:var(--r-md);
    padding:18px;text-align:center;font-size:13px;color:var(--ink-soft);
  }

  /* ============ manual sheet ============ */
  .sheet-open{
    display:block;width:100%;background:none;border:none;color:var(--ink-soft);
    font-size:13px;min-height:44px;margin-top:var(--s4);text-decoration:underline;
    text-underline-offset:3px;text-decoration-color:var(--line-strong);
  }
  .overlay{
    position:fixed;inset:0;background:rgba(26,24,21,.32);z-index:60;
    display:none;align-items:center;justify-content:center;padding:var(--s6);
  }
  .overlay.show{display:flex;}
  .sheet-overlay{align-items:flex-end;justify-content:center;padding:0;}
  .sheet{
    position:relative;width:100%;max-width:560px;background:var(--surface);
    border-radius:30px 30px 0 0;padding:14px 26px 30px;box-shadow:var(--shadow-float);
    padding-bottom:calc(30px + env(safe-area-inset-bottom));
    animation:sheetUp var(--dur-slow) var(--ease-out);
  }
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
  .grab{width:40px;height:4px;border-radius:99px;background:rgba(26,24,21,.16);margin:0 auto 22px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px;}
  .sheet-head b{font-size:19px;font-weight:600;}
  .sheet-head span{font-size:13px;color:var(--ink-soft);}
  .sheet .fld{margin-bottom:14px;}
  .sheet .fld label{font-size:12px;color:var(--ink-soft);display:block;margin-bottom:7px;}
  /* 인원 스테퍼 */
  .stepper{display:flex;align-items:center;justify-content:center;gap:var(--s6);margin:var(--s2) 0 var(--s6);}
  .step-btn{
    width:56px;height:56px;border-radius:50%;border:1px solid var(--line-strong);
    background:var(--surface-2);color:var(--ink);font-size:26px;line-height:1;
    display:grid;place-items:center;transition:opacity var(--dur-fast) ease;
  }
  .step-btn:disabled{opacity:.3;}
  .step-btn:active:not(:disabled){background:var(--bg);}
  .step-num{
    width:110px;border:none;background:transparent;text-align:center;
    font-family:var(--font-display);font-size:56px;line-height:1;color:var(--ink);
    font-variant-numeric:tabular-nums;padding:0;
  }
  .step-num:focus{outline:none;}
  .step-num::placeholder{color:rgba(26,24,21,.18);}
  .step-num::-webkit-outer-spin-button,.step-num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sheet-actions{display:flex;gap:10px;}
  .sheet-actions .btn{flex:1;min-height:52px;font-size:15px;font-weight:600;}

  .btn-add{
    width:100%;border:none;background:var(--accent);color:var(--accent-fg);
    font-size:16px;font-weight:600;min-height:52px;border-radius:var(--r-md);margin-top:6px;
  }

  /* ============ modal ============ */
  .modal{
    background:var(--surface);border-radius:var(--r-lg);padding:26px;
    max-width:340px;width:100%;box-shadow:0 18px 50px -20px rgba(26,24,21,.5);
  }
  .modal p{font-size:14.5px;margin:0 0 var(--s6);line-height:1.6;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn-ghost{flex:1;}

  /* ============ board (전광판) ============ */
  #board{
    position:fixed;inset:0;z-index:9999;display:none;flex-direction:column;
    background:radial-gradient(ellipse 120% 90% at 50% 15%, #16233F 0%, #0A1120 45%, #000 100%);
    color:#fff;overflow:hidden;padding:0 30px;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  #board.on{display:flex;}
  #board::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  }
  #board .b-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:30px;position:relative;}
  #board .b-tag{
    font-family:var(--font-display);font-size:22px;letter-spacing:.42em;color:var(--board-cyan);
    text-shadow:0 0 14px rgba(102,224,232,.7), 0 0 30px rgba(102,224,232,.35);
  }
  #board .b-time{font-family:var(--font-display);font-size:16px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums;}
  #board .b-rule{height:1px;background:linear-gradient(90deg, rgba(127,227,232,.5), transparent);margin-top:var(--s4);position:relative;}
  #board .b-list{
    flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;
    position:relative;overflow-y:auto;
  }
  #board .b-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:var(--s6);
    padding:15px 2px;border-bottom:1px solid rgba(255,255,255,.07);
    opacity:0;transform:translateY(16px);animation:bIn .45s var(--ease-out) forwards;
  }
  @keyframes bIn{to{opacity:1;transform:none;}}
  #board .b-name{font-size:37px;color:#F2EEE6;font-weight:500;letter-spacing:-.01em;line-height:1.15;}
  #board .b-qty{
    font-family:var(--font-display);font-size:48px;line-height:.9;color:var(--board-amber);
    text-shadow:0 0 16px rgba(244,183,64,.6), 0 0 34px rgba(244,183,64,.3);
    font-variant-numeric:tabular-nums;
  }
  #board .b-foot{display:flex;justify-content:center;padding:var(--s6) 0 40px;position:relative;}
  #board .b-total{
    display:inline-flex;align-items:baseline;gap:var(--s3);padding:15px 34px;border-radius:999px;
    border:1.5px solid rgba(127,227,232,.7);background:rgba(127,227,232,.08);
    box-shadow:0 0 22px rgba(127,227,232,.28), inset 0 0 22px rgba(127,227,232,.14);
  }
  #board .b-total .l{font-family:var(--font-display);font-size:16px;letter-spacing:.3em;color:var(--board-cyan);}
  #board .b-total .v{
    font-family:var(--font-display);font-size:32px;color:#EAF9FA;
    text-shadow:0 0 12px rgba(127,227,232,.5);font-variant-numeric:tabular-nums;
  }
  #board .b-hint{position:absolute;bottom:var(--s2);left:0;right:0;text-align:center;font-size:11px;color:#37455C;letter-spacing:.1em;}
  /* 가로 모드에서도 레이아웃 유지 */
  @media (orientation:landscape) and (max-height:520px){
    #board .b-head{margin-top:var(--s3);}
    #board .b-list{justify-content:flex-start;gap:0;}
    #board .b-row{padding:var(--s2) 2px;}
    #board .b-name{font-size:26px;}
    #board .b-qty{font-size:34px;}
    #board .b-foot{padding:var(--s3) 0 var(--s4);}
    #board .b-total{padding:10px 26px;}
    #board .b-total .v{font-size:24px;}
    #board .b-hint{display:none;}
  }

  /* ============ a11y ============ */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
    .ring{display:none;}
    #board .b-row{opacity:1;transform:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title num">Order Together</div>
      <div class="date" id="dateLbl"></div>
    </div>
    <button class="reset-btn" onclick="askReset()">새 주문 시작</button>
  </header>

  <div class="counter-board">
    <button class="counter tappable" id="peopleCard" onclick="openPeopleSheet()" aria-label="참여 인원 — 탭하여 전체 인원 설정">
      <div class="lbl">참여 인원</div>
      <div class="num"><span class="roll" id="peopleCount"><span>0</span></span><span class="unit" id="peopleUnit">명</span></div>
      <div class="counter-sub" id="peopleSub">탭하여 전체 인원 설정</div>
    </button>
    <div class="counter">
      <div class="lbl">전체 주문</div>
      <div class="num"><span class="roll" id="orderCount"><span>0</span></span><span class="unit">잔</span></div>
      <div class="counter-sub"></div>
    </div>
  </div>

  <div class="mic-stage">
    <div class="mic-holder" id="micHolder">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <button class="mic-btn" id="micBtn" onclick="startFlow()" aria-label="음성 주문 시작">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
    </div>
    <div class="mic-status" id="micStatus" aria-live="polite">탭하여 주문 받기</div>
    <div class="mic-sub" id="micSub">폰을 돌려가며 한 명씩 말해요</div>

    <div class="action-bar">
      <button class="btn btn-ghost" onclick="undoLast()">방금 취소</button>
      <button class="btn btn-primary" id="copyBtn" onclick="copySummary()">주문 복사</button>
    </div>
    <button class="btn-board" onclick="showBoard()">매장에 보여주기 →</button>

    <div class="confirm-card" id="confirmCard" style="display:none;">
      <div class="hint">자동으로 나눴어요 — 틀렸으면 눌러서 고쳐주세요</div>
      <div class="confirm-boxes">
        <div class="confirm-box"><label for="cfName">이름</label><input class="field" id="cfName" maxlength="8"></div>
        <div class="confirm-box"><label for="cfItem">메뉴</label><input class="field" id="cfItem"></div>
      </div>
      <div class="confirm-actions">
        <button class="btn btn-danger" onclick="confirmAdd()">추가하기</button>
        <button class="btn btn-ghost" style="flex:1;width:auto" onclick="cancelConfirm()">다시 말하기</button>
      </div>
    </div>

    <button class="sheet-open" onclick="openSheet()">음성이 잘 안 될 때 · 직접 입력</button>
  </div>

  <div class="section-lbl">
    <span id="listLbl">메뉴별로 모아보기</span>
    <button class="toggle-view" id="viewToggle" onclick="toggleView()">시간순으로 보기</button>
  </div>
  <div id="listArea"></div>
</div>

<!-- 전체 인원 설정 시트 -->
<div class="overlay sheet-overlay" id="peopleOverlay" onclick="if(event.target===this)closePeopleSheet()">
  <div class="sheet" role="dialog" aria-label="전체 인원 설정">
    <div class="grab"></div>
    <div class="sheet-head"><b>전체 인원</b><span>몇 명이 주문하나요?</span></div>
    <div class="stepper">
      <button class="step-btn" id="stepMinus" onclick="stepPeople(-1)" aria-label="한 명 줄이기">−</button>
      <input class="step-num" id="peopleInput" type="number" inputmode="numeric" min="1" max="999"
             placeholder="0" aria-label="전체 인원 수" oninput="syncStepper()">
      <button class="step-btn" onclick="stepPeople(1)" aria-label="한 명 늘리기">＋</button>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" onclick="skipPeople()">나중에</button>
      <button class="btn btn-danger" onclick="applyPeople()">설정하기</button>
    </div>
  </div>
</div>

<!-- 직접 입력 시트 -->
<div class="overlay sheet-overlay" id="sheetOverlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" role="dialog" aria-label="직접 입력">
    <div class="grab"></div>
    <div class="sheet-head"><b>직접 입력</b><span>음성이 어려울 때</span></div>
    <div class="fld">
      <label for="manualName">주문자 이름</label>
      <input class="field" id="manualName" placeholder="예: 성진">
    </div>
    <div class="fld">
      <label for="manualItem">메뉴</label>
      <input class="field" id="manualItem" placeholder="예: 아이스 아메리카노">
    </div>
    <button class="btn-add" onclick="manualAdd()">＋ 주문 추가</button>
  </div>
</div>

<!-- 초기화 확인 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <p>지금까지 모은 주문을 전부 지우고 새로 시작할까요? 되돌릴 수 없어요.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay()">취소</button>
      <button class="btn btn-danger" onclick="doReset()">전부 지우기</button>
    </div>
  </div>
</div>

<script>
let orders = [];
let viewMode = 'grouped';
let step = 'idle';
let totalPeople = null;   // 전체 인원 — 미설정이면 null

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const seenIds = new Set();

document.getElementById('dateLbl').textContent =
  new Date().toLocaleDateString('ko-KR', {year:'numeric', month:'long', day:'numeric'});

// ---------- storage ----------
const hasCloud = typeof window.storage !== 'undefined';
async function loadOrders(){
  try{
    if(hasCloud){
      const res = await window.storage.get('orders', false);
      orders = res && res.value ? JSON.parse(res.value) : [];
    } else {
      orders = JSON.parse(localStorage.getItem('orders') || '[]');
    }
  }catch(e){ orders = []; }
  try{
    const t = localStorage.getItem('totalPeople');
    totalPeople = t ? parseInt(t,10) : null;
    if(!(totalPeople > 0)) totalPeople = null;
  }catch(e){ totalPeople = null; }
  orders.forEach(o=>seenIds.add(o.id));   // 복원된 주문은 등장 애니메이션 생략
  render();
}
async function saveOrders(){
  try{
    if(hasCloud) await window.storage.set('orders', JSON.stringify(orders), false);
    else localStorage.setItem('orders', JSON.stringify(orders));
  }catch(e){}
}
function saveTotalPeople(){
  try{
    if(totalPeople) localStorage.setItem('totalPeople', String(totalPeople));
    else localStorage.removeItem('totalPeople');
  }catch(e){}
}

// ---------- name/menu 자동 분리 ----------
function splitNameAndItem(text){
  text = text.trim().replace(/\s+/g,' ');
  const parts = text.split(' ');
  const stripJosa = (w)=> w.replace(/(은요|는요|이요|이에요|예요|은|는|이|가)$/,'');
  if(parts.length >= 2){
    const first = stripJosa(parts[0]);
    if(/^[가-힣]{2,4}$/.test(first)){
      return {name:first, item:parts.slice(1).join(' ')};
    }
  }
  if(/^[가-힣]{5,}/.test(text)){
    return {name:text.slice(0,3), item:text.slice(3)};
  }
  return {name:'', item:text};
}

// ---------- UI helpers ----------
// 숫자 변경 시 위로 슬라이드되는 카운트업
function setNum(id, value){
  const box = document.getElementById(id);
  const cur = box.firstElementChild;
  if(cur && cur.textContent === String(value)) return;
  const next = document.createElement('span');
  next.textContent = value;
  box.innerHTML = '';
  box.appendChild(next);
  if(!reduceMotion){
    void next.offsetWidth;
    next.classList.add('rolling');
    next.addEventListener('animationend', ()=>next.classList.remove('rolling'), {once:true});
  }
}
// 상태 텍스트는 페이드로 교체
function fadeText(el, txt){
  if(el.textContent === txt) return;
  if(reduceMotion){ el.textContent = txt; return; }
  el.classList.add('fade-out');
  setTimeout(()=>{ el.textContent = txt; el.classList.remove('fade-out'); }, 140);
}

// ---------- speech ----------
const speechSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function getRecognizer(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R) return null;
  const r = new R();
  r.lang = 'ko-KR'; r.interimResults = false; r.maxAlternatives = 1;
  return r;
}
function setMicUI(listening, status, sub){
  document.getElementById('micHolder').classList.toggle('listening', listening);
  fadeText(document.getElementById('micStatus'), status);
  fadeText(document.getElementById('micSub'), sub || '');
}

let recog = null, running = false, pendingTimer = null;

function startFlow(){
  if(running){ stopFlow(); return; }
  if(!speechSupported){
    setMicUI(false, '이 브라우저는 음성 인식을 지원하지 않아요', '아래 "직접 입력"을 이용해주세요');
    return;
  }
  recog = getRecognizer();
  recog.continuous = true;
  recog.interimResults = true;
  running = true;
  setMicUI(true, '듣는 중…', '한 명씩 말하고 폰을 넘기세요');

  recog.onresult = (e)=>{
    let interim = '', fin = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) fin += t; else interim += t;
    }
    if(interim) document.getElementById('micSub').textContent = interim;
    if(fin.trim()){
      clearTimeout(pendingTimer);
      const text = fin.trim();
      pendingTimer = setTimeout(()=>{
        const {name, item} = splitNameAndItem(text);
        if(!item) return;
        addOrder(name || '손님' + (orders.length+1), item);
        setMicUI(true, '담았어요 — 다음 분!', (name?name+' · ':'') + item);
      }, 800);
    }
  };
  recog.onerror = (e)=>{
    if(e.error === 'not-allowed'){ running=false; setMicUI(false,'마이크 권한을 허용해주세요',''); }
  };
  recog.onend = ()=>{ if(running){ try{ recog.start(); }catch(err){} } };
  try{ recog.start(); }catch(err){ running=false; setMicUI(false,'다시 눌러주세요',''); }
}

function stopFlow(){
  running = false;
  clearTimeout(pendingTimer);
  if(recog){ try{ recog.stop(); }catch(e){} }
  setMicUI(false, '멈췄어요', '탭하여 다시 시작');
}

function undoLast(){
  if(!orders.length) return;
  orders.sort((a,b)=>a.ts-b.ts).pop();
  saveOrders(); render();
  setMicUI(running, running?'듣는 중…':'방금 주문을 취소했어요', running?'한 명씩 말하고 폰을 넘기세요':'');
}

function groupOrders(){
  const map = new Map();
  orders.forEach(o=>{ const k=normalize(o.item); if(!map.has(k)) map.set(k,{item:o.item,n:0}); map.get(k).n++; });
  return [...map.values()].sort((a,b)=>b.n-a.n);
}

// ---------- board ----------
function showBoard(){
  if(!orders.length) return;
  if(running) stopFlow();
  const groups = groupOrders();
  document.getElementById('boardBody').innerHTML = groups.map((g,i)=>
    `<div class="b-row" style="animation-delay:${i*0.07}s"><span class="b-name">${escapeHtml(g.item)}</span><span class="b-qty">${g.n}</span></div>`).join('');
  document.getElementById('bTotalNum').textContent = orders.length;
  const n = new Date();
  const h = n.getHours();
  document.getElementById('bTime').textContent =
    (h%12||12) + ':' + String(n.getMinutes()).padStart(2,'0') + ' ' + (h<12?'AM':'PM');
  document.getElementById('board').classList.add('on');
  if(screen.orientation && screen.orientation.lock){ try{ screen.orientation.lock('portrait'); }catch(e){} }
}
function hideBoard(){ document.getElementById('board').classList.remove('on'); }

// ---------- copy ----------
const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function copySummary(){
  if(!orders.length) return;
  const map = new Map();
  orders.forEach(o=>{ const k=normalize(o.item); map.set(k,(map.get(k)||{item:o.item,n:0})); map.get(k).n++; });
  const lines = [...map.values()].sort((a,b)=>b.n-a.n).map(g=>`${g.item} ${g.n}`);
  const txt = lines.join('\n') + `\n— 총 ${orders.length}잔`;
  const done = ()=>{
    const b = document.getElementById('copyBtn');
    b.classList.add('btn-check');
    b.innerHTML = CHECK_SVG;
    setTimeout(()=>{ b.classList.remove('btn-check'); b.textContent='주문 복사'; }, 1500);
  };
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); cb(); }catch(e){} ta.remove();
}

// ---------- add / remove ----------
function cancelConfirm(){
  document.getElementById('confirmCard').style.display='none';
  step='idle';
  setMicUI(false, '탭하여 다시 말해주세요', '');
}
function confirmAdd(){
  const name = document.getElementById('cfName').value.trim();
  const item = document.getElementById('cfItem').value.trim();
  if(!name || !item){ return; }
  addOrder(name, item);
  document.getElementById('confirmCard').style.display='none';
  step='idle';
  setMicUI(false, '추가했어요!', '다음 사람에게 폰을 건네주세요');
}

function addOrder(name, item){
  orders.push({id: Date.now()+Math.random().toString(16).slice(2), name: name.trim(), item: item.trim(), ts: Date.now()});
  saveOrders(); render();
}
function manualAdd(){
  const n = document.getElementById('manualName');
  const i = document.getElementById('manualItem');
  if(!n.value.trim() || !i.value.trim()) return;
  addOrder(n.value, i.value);
  n.value=''; i.value='';
  closeSheet();
}
function removeOrder(id){ orders = orders.filter(o=>o.id!==id); saveOrders(); render(); }
// 삭제 시 좌측으로 페이드 아웃 후 제거
function removeOrderAnimated(id, el){
  if(reduceMotion || !el){ removeOrder(id); return; }
  el.classList.add('removing');
  setTimeout(()=>removeOrder(id), 180);
}

// ---------- sheets / overlays ----------
function openSheet(){ document.getElementById('sheetOverlay').classList.add('show'); document.getElementById('manualName').focus(); }
function closeSheet(){ document.getElementById('sheetOverlay').classList.remove('show'); }
// 새 주문 시작 — 담긴 주문이 있으면 먼저 확인, 없으면 바로 인원 설정으로
function askReset(){
  if(!orders.length){ totalPeople=null; saveTotalPeople(); render(); openPeopleSheet(); return; }
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function doReset(){
  orders=[]; seenIds.clear(); totalPeople=null;
  saveOrders(); saveTotalPeople(); render(); closeOverlay();
  openPeopleSheet();
}

// ---------- 전체 인원 설정 ----------
function openPeopleSheet(){
  const input = document.getElementById('peopleInput');
  input.value = totalPeople ? totalPeople : '';   // 기본값 없음
  syncStepper();
  document.getElementById('peopleOverlay').classList.add('show');
  input.focus();
}
function closePeopleSheet(){ document.getElementById('peopleOverlay').classList.remove('show'); }
function stepPeople(d){
  const input = document.getElementById('peopleInput');
  const cur = parseInt(input.value, 10);
  const next = Math.min(999, Math.max(1, (isNaN(cur) ? 0 : cur) + d));
  input.value = next;
  syncStepper();
}
function syncStepper(){
  const cur = parseInt(document.getElementById('peopleInput').value, 10);
  document.getElementById('stepMinus').disabled = !(cur > 1);
}
function applyPeople(){
  const cur = parseInt(document.getElementById('peopleInput').value, 10);
  totalPeople = (cur > 0) ? Math.min(999, cur) : null;
  saveTotalPeople(); render(); closePeopleSheet();
}
// 강제하지 않는다 — 건너뛰면 미설정 상태 유지
function skipPeople(){ closePeopleSheet(); }

// 상태 카드의 인원 표시 갱신
function renderPeople(joined){
  const card = document.getElementById('peopleCard');
  const unit = document.getElementById('peopleUnit');
  const sub  = document.getElementById('peopleSub');
  if(!totalPeople){
    unit.className = 'unit'; unit.textContent = '명';
    sub.textContent = '탭하여 전체 인원 설정';
    card.classList.remove('full');
    return;
  }
  unit.className = 'goal'; unit.textContent = '/ ' + totalPeople;
  const left = totalPeople - joined;
  const done = left <= 0;
  sub.textContent = done ? '모두 주문했어요' : left + '명 남았어요';
  card.classList.toggle('full', done);
}

// ---------- render ----------
function toggleView(){
  viewMode = viewMode==='grouped' ? 'flat' : 'grouped';
  document.getElementById('viewToggle').textContent = viewMode==='grouped' ? '시간순으로 보기' : '메뉴별로 보기';
  document.getElementById('listLbl').textContent = viewMode==='grouped' ? '메뉴별로 모아보기' : '말한 순서대로';
  render();
}
function normalize(s){ return s.trim().replace(/\s+/g,' ').toLowerCase(); }

// 새로 추가된 주문만 슬라이드 인 — 매 렌더마다 전체가 다시 튀지 않게
function isNew(o){
  if(seenIds.has(o.id)) return false;
  seenIds.add(o.id);
  return !reduceMotion;
}

function render(){
  const joined = new Set(orders.map(o=>o.name.trim())).size;
  setNum('peopleCount', joined);
  setNum('orderCount', orders.length);
  renderPeople(joined);
  const area = document.getElementById('listArea');
  area.innerHTML = '';

  if(orders.length===0){
    area.innerHTML = '<div class="empty">아직 담긴 주문이 없어요</div>';
    return;
  }

  const card = document.createElement('div');
  card.className = 'order-card';

  if(viewMode==='flat'){
    [...orders].sort((a,b)=>a.ts-b.ts).forEach(o=>{
      const row = document.createElement('div');
      row.className = 'o-row' + (isNew(o) ? ' row-in' : '');
      row.innerHTML =
        `<div class="o-main"><div class="o-name">${escapeHtml(o.item)}</div>` +
        `<div class="o-who">${escapeHtml(o.name)}</div></div>` +
        `<div class="o-qty num">1</div>`;
      card.appendChild(row);
    });
    area.appendChild(card);
    return;
  }

  const map = new Map();
  orders.forEach(o=>{
    const key = normalize(o.item);
    if(!map.has(key)) map.set(key, {item:o.item, entries:[]});
    map.get(key).entries.push(o);
  });
  const groups = [...map.values()].sort((a,b)=>b.entries.length-a.entries.length);

  groups.forEach(g=>{
    const row = document.createElement('div');
    row.className = 'o-row' + (g.entries.some(isNew) ? ' row-in' : '');
    const whoHtml = g.entries.map(e=>
      `<span class="name-chip">${escapeHtml(e.name)}<button data-id="${e.id}" aria-label="${escapeHtml(e.name)} 주문 삭제">✕</button></span>`
    ).join('');
    row.innerHTML =
      `<div class="o-main"><div class="o-name">${escapeHtml(g.item)}</div>` +
      `<div class="o-who">${whoHtml}</div></div>` +
      `<div class="o-qty num">${g.entries.length}</div>`;
    card.appendChild(row);
  });
  area.appendChild(card);

  card.querySelectorAll('.name-chip button').forEach(btn=>{
    btn.onclick = ()=> removeOrderAnimated(btn.dataset.id, btn.closest('.name-chip'));
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

loadOrders();
</script>

<div id="board" onclick="hideBoard()">
  <div class="b-head"><span class="b-tag">ORDER</span><span class="b-time" id="bTime"></span></div>
  <div class="b-rule"></div>
  <div class="b-list" id="boardBody"></div>
  <div class="b-foot">
    <div class="b-total"><span class="l">TOTAL</span><span class="v" id="bTotalNum">0</span></div>
  </div>
  <div class="b-hint">화면을 누르면 닫힙니다</div>
</div>
</body>
</html>
