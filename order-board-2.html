<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말하면 모이는 주문</title>
<meta name="theme-color" content="#B23A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주문판">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23B23A2E'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23F6F1E4' font-family='sans-serif' font-weight='900'%3E주%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/json,{"name":"말하면 모이는 주문","short_name":"주문판","display":"standalone","start_url":".","background_color":"%23F6F1E4","theme_color":"%23B23A2E"}'>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E4; --paper-2:#EFE7D3; --ink:#23211D; --ink-soft:#5C574B;
    --red:#B23A2E; --amber:#D98E2B; --sage:#6E8B6B; --line:#DED0B0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(35,33,29,0.05) 1px, transparent 0);
    background-size:14px 14px;
    color:var(--ink); font-family:'Pretendard', -apple-system, sans-serif;
    min-height:100vh; padding-bottom:40px;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 8px;}

  header{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:14px;border-bottom:2px dashed var(--line);}
  header .title{font-weight:800;font-size:19px;letter-spacing:-0.02em;}
  header .date{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .reset-btn{background:none;border:1px solid var(--line);color:var(--ink-soft);font-size:12px;padding:6px 10px;border-radius:999px;font-family:inherit;}

  .counter-board{display:flex;gap:10px;margin:16px 0;}
  .counter{flex:1;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;}
  .counter .num{font-family:'JetBrains Mono';font-weight:800;font-size:28px;line-height:1;color:#FFE8B0;}
  .counter .lbl{font-size:11px;color:#B9B4A4;margin-top:4px;letter-spacing:0.03em;}

  .mic-stage{display:flex;flex-direction:column;align-items:center;padding:22px 0 8px;}
  .mic-btn{
    width:112px;height:112px;border-radius:50%;background:var(--red);border:none;color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 0 #7C2820, 0 10px 18px rgba(0,0,0,0.2); transition:transform .08s ease;
  }
  .mic-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #7C2820, 0 4px 10px rgba(0,0,0,0.2);}
  .mic-btn.listening{background:var(--amber);animation:pulse 1.1s infinite;box-shadow:0 8px 0 #A66B18, 0 10px 18px rgba(0,0,0,0.2);}
  @keyframes pulse{
    0%{box-shadow:0 8px 0 #A66B18, 0 0 0 0 rgba(217,142,43,0.5);}
    70%{box-shadow:0 8px 0 #A66B18, 0 0 0 16px rgba(217,142,43,0);}
    100%{box-shadow:0 8px 0 #A66B18, 0 0 0 0 rgba(217,142,43,0);}
  }
  .mic-status{margin-top:14px;font-weight:700;font-size:14.5px;min-height:20px;text-align:center;}
  .mic-sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;text-align:center;min-height:16px;}

  .confirm-card{width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px;}
  .confirm-card .hint{font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .confirm-boxes{display:flex;gap:8px;}
  .confirm-box{flex:1;min-width:0;}
  .confirm-box label{font-size:10.5px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .confirm-box input{
    width:100%;border:1.5px solid var(--line);border-radius:8px;padding:10px 10px;
    font-family:inherit;font-size:16px;font-weight:700;background:var(--paper-2);
  }
  .confirm-box input:focus{outline:2px solid var(--amber);border-color:var(--amber);}
  .confirm-actions{display:flex;gap:8px;margin-top:12px;}
  .btn{font-family:inherit;border:none;border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:700;flex:1;}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-ghost{background:var(--paper-2);color:var(--ink);}

  .action-bar{display:flex;gap:8px;width:100%;margin-top:16px;}
  .manual-entry{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);}
  .manual-entry summary{font-size:13px;color:var(--ink-soft);cursor:pointer;}
  .manual-row{display:flex;gap:8px;margin-top:10px;}
  .manual-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:14px;background:#fff;min-width:0;}
  .manual-row button{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:0 14px;font-weight:700;}

  .section-lbl{font-size:12px;color:var(--ink-soft);letter-spacing:0.04em;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .toggle-view{background:none;border:none;color:var(--red);font-size:12px;font-weight:700;font-family:inherit;}

  .order-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .order-table th{
    text-align:left;font-size:11px;color:var(--ink-soft);font-weight:700;
    background:var(--paper-2);padding:9px 10px;letter-spacing:0.03em;
  }
  .order-table td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:top;}
  .order-table th:nth-child(2), .order-table td:nth-child(2){text-align:center;width:52px;}
  .menu-cell{display:flex;align-items:center;gap:9px;}
  .menu-icon{
    width:32px;height:32px;flex-shrink:0;border-radius:8px;background:var(--paper-2);
    display:flex;align-items:center;justify-content:center;
  }
  .menu-name{font-weight:700;font-size:14.5px;line-height:1.25;}
  .cat-tag{
    display:inline-block;font-size:9.5px;color:var(--ink-soft);background:var(--paper-2);
    border:1px solid var(--line);border-radius:999px;padding:1px 7px;margin-top:3px;
  }
  .count-badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;
    font-family:'JetBrains Mono';font-weight:800;font-size:13px;
  }
  .names-cell{font-size:12px;color:var(--ink-soft);}
  .name-chip{display:inline-flex;align-items:center;gap:4px;background:var(--paper-2);border-radius:999px;padding:3px 4px 3px 9px;margin:2px 3px 2px 0;}
  .name-chip button{background:var(--ink);color:var(--paper);border:none;border-radius:50%;width:14px;height:14px;font-size:9px;line-height:1;}

  .flat-list{font-size:13px;}
  .flat-row{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);}
  .flat-row .n{font-weight:700;width:64px;flex-shrink:0;}
  .flat-row .t{color:var(--ink-soft);flex:1;}

  .empty{text-align:center;color:var(--ink-soft);font-size:13.5px;padding:34px 10px;border:1px dashed var(--line);border-radius:12px;}

  .overlay{position:fixed;inset:0;background:rgba(35,33,29,0.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:#fff;border-radius:14px;padding:20px;max-width:320px;width:100%;}
  .modal p{font-size:14px;margin:0 0 16px;}
  .modal-actions{display:flex;gap:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="title">말하면 모이는 주문</div>
      <div class="date mono" id="dateLbl"></div>
    </div>
    <button class="reset-btn" onclick="askReset()">새 주문 시작</button>
  </header>

  <div class="counter-board">
    <div class="counter"><div class="num mono" id="peopleCount">0</div><div class="lbl">참여 인원</div></div>
    <div class="counter"><div class="num mono" id="orderCount">0</div><div class="lbl">전체 주문</div></div>
  </div>

  <div class="mic-stage">
    <button class="mic-btn" id="micBtn" onclick="startFlow()">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" fill="currentColor"/><path d="M19 11a7 7 0 01-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="mic-status" id="micStatus">눌러서 시작 — 한 명씩 말하면 됩니다</div>
    <div class="mic-sub" id="micSub">예: "김철수 아이스 아메리카노"</div>

    <div class="action-bar">
      <button class="btn btn-ghost" onclick="undoLast()">방금 취소</button>
      <button class="btn btn-primary" id="copyBtn" onclick="copySummary()">주문 복사하기</button>
    </div>

    <div class="confirm-card" id="confirmCard" style="display:none;">
      <div class="hint">자동으로 나눴어요 — 틀렸으면 박스를 눌러 고쳐주세요</div>
      <div class="confirm-boxes">
        <div class="confirm-box"><label>이름</label><input id="cfName" maxlength="8"></div>
        <div class="confirm-box"><label>메뉴</label><input id="cfItem"></div>
      </div>
      <div class="confirm-actions">
        <button class="btn btn-primary" onclick="confirmAdd()">추가하기</button>
        <button class="btn btn-ghost" onclick="cancelConfirm()">다시 말하기</button>
      </div>
    </div>

    <details class="manual-entry">
      <summary>음성이 잘 안 될 때 직접 입력</summary>
      <div class="manual-row">
        <input id="manualName" placeholder="이름">
        <input id="manualItem" placeholder="메뉴">
        <button onclick="manualAdd()">추가</button>
      </div>
    </details>
  </div>

  <div class="section-lbl">
    <span id="listLbl">메뉴별로 모아보기</span>
    <button class="toggle-view" id="viewToggle" onclick="toggleView()">시간순으로 보기</button>
  </div>
  <div id="listArea"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <p>지금까지 모은 주문을 전부 지우고 새로 시작할까요? 되돌릴 수 없어요.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeOverlay()">취소</button>
      <button class="btn btn-primary" style="background:var(--red)" onclick="doReset()">전부 지우기</button>
    </div>
  </div>
</div>

<script>
let orders = [];
let viewMode = 'grouped';
let step = 'idle';

document.getElementById('dateLbl').textContent = new Date().toLocaleDateString('ko-KR', {month:'long', day:'numeric', weekday:'short'});

// ---------- storage ----------
const hasCloud = typeof window.storage !== 'undefined';
async function loadOrders(){
  try{
    if(hasCloud){
      const res = await window.storage.get('orders', false);
      orders = res && res.value ? JSON.parse(res.value) : [];
    } else {
      orders = JSON.parse(localStorage.getItem('orders') || '[]');
    }
  }catch(e){ orders = []; }
  render();
}
async function saveOrders(){
  try{
    if(hasCloud) await window.storage.set('orders', JSON.stringify(orders), false);
    else localStorage.setItem('orders', JSON.stringify(orders));
  }catch(e){}
}
loadOrders();

// ---------- name/menu 자동 분리 ----------
function splitNameAndItem(text){
  text = text.trim().replace(/\s+/g,' ');
  const parts = text.split(' ');
  const stripJosa = (w)=> w.replace(/(은요|는요|이요|이에요|예요|은|는|이|가)$/,'');
  if(parts.length >= 2){
    const first = stripJosa(parts[0]);
    if(/^[가-힣]{2,4}$/.test(first)){
      return {name:first, item:parts.slice(1).join(' ')};
    }
  }
  if(/^[가-힣]{5,}/.test(text)){
    return {name:text.slice(0,3), item:text.slice(3)};
  }
  return {name:'', item:text};
}

// ---------- 메뉴 아이콘 (직접 그린 SVG) ----------
const I = {
  cupDark: `<path d="M5.5 8h12l-1 8.5a2 2 0 01-2 2h-6a2 2 0 01-2-2L5.5 8z" fill="#4A3626"/><path d="M5.5 8h12l-1 8.5a2 2 0 01-2 2h-6a2 2 0 01-2-2L5.5 8z" stroke="#23211D" stroke-width="1.1"/><path d="M17.2 9.6h1.4a1.9 1.9 0 010 3.8h-1.4" stroke="#23211D" stroke-width="1.2" fill="none"/><path d="M8.5 5.2c.5-.9.5-1.3 0-2.1M11.5 5.2c.5-.9.5-1.3 0-2.1" stroke="#B23A2E" stroke-width="1.2" stroke-linecap="round"/>`,
  cupLight: `<path d="M5.5 8h12l-1 8.5a2 2 0 01-2 2h-6a2 2 0 01-2-2L5.5 8z" fill="#EFD9AE"/><path d="M5.5 8h12l-1 8.5a2 2 0 01-2 2h-6a2 2 0 01-2-2L5.5 8z" stroke="#23211D" stroke-width="1.1"/><path d="M17.2 9.6h1.4a1.9 1.9 0 010 3.8h-1.4" stroke="#23211D" stroke-width="1.2" fill="none"/><path d="M9 11.4a2 1.4 0 104 0 2 1.4 0 10-4 0" fill="#fff" stroke="#4A3626" stroke-width="0.6"/>`,
  tea: `<path d="M12 3.5c3 2.7 3 7 0 9.7-3-2.7-3-7 0-9.7z" fill="#6E8B6B"/><path d="M12 13.2v7.3" stroke="#6E8B6B" stroke-width="1.5" stroke-linecap="round"/><path d="M4.5 18h15" stroke="#DED0B0" stroke-width="1.4" stroke-linecap="round"/>`,
  citrus: `<circle cx="12" cy="12" r="7.5" fill="#D98E2B"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="#23211D" stroke-width="1"/><g stroke="#FCEFD2" stroke-width="1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/><path d="M7 7l10 10M17 7L7 17"/></g>`,
  drink: `<path d="M7.5 4h9l-1.1 14.2a2 2 0 01-2 1.8h-2.8a2 2 0 01-2-1.8L7.5 4z" fill="#B23A2E" stroke="#23211D" stroke-width="1"/><path d="M6.5 4h11" stroke="#23211D" stroke-width="1.3" stroke-linecap="round"/>`,
  dessert: `<path d="M4.5 17.5h15v-1a3 3 0 00-3-3h-9a3 3 0 00-3 3v1z" fill="#EFD9AE" stroke="#23211D" stroke-width="1.1"/><path d="M6.5 13.5L12 4l5.5 9.5" fill="none" stroke="#B23A2E" stroke-width="1.3" stroke-linejoin="round"/>`,
  meat: `<path d="M8.3 14.3c-2.8-2.8-2.8-6.5 1-8.4 2.9-1.8 6.5.8 6.5 3.8 0 3.6-3.6 5.6-3.6 5.6l3.6 3.6-1.8 1.8-3.6-3.6s-1 0-2.1-1z" fill="#B23A2E" stroke="#23211D" stroke-width="0.8"/><circle cx="6.6" cy="17.3" r="1.9" fill="#fff" stroke="#23211D" stroke-width="1"/>`,
  noodle: `<path d="M4.5 10.5h15a7.5 7.5 0 01-15 0z" fill="#EFD9AE" stroke="#23211D" stroke-width="1.1"/><path d="M7 8.5c1-1.8 2.8-1.8 2.8 0M11 8.5c1-1.8 2.8-1.8 2.8 0M15 8.5c1-1.8 2-1.8 2 0" stroke="#6E8B6B" stroke-width="1.2" stroke-linecap="round" fill="none"/>`,
  pizza: `<path d="M12 3.5L19.5 18h-15L12 3.5z" fill="#D98E2B" stroke="#23211D" stroke-width="1.1"/><circle cx="12" cy="10.5" r="1" fill="#B23A2E"/><circle cx="10" cy="13.5" r="1" fill="#B23A2E"/><circle cx="14" cy="13.5" r="1" fill="#B23A2E"/>`,
  chicken: `<path d="M13.5 5c2.8 0 4.7 2.3 3.7 5-1 2.7-4.2 2.8-4.2 2.8l3.7 3.7-1.8 1.8-3.7-3.7s-2.3.5-3.7-1.3c-1.3-1.8-1-4.2 1-5.5 1.2-1.6 3-2.8 5-2.8z" fill="#D98E2B" stroke="#23211D" stroke-width="0.9"/>`,
  plate: `<circle cx="12" cy="12" r="7.5" fill="#fff" stroke="#23211D" stroke-width="1.3"/><circle cx="12" cy="12" r="4" fill="none" stroke="#DED0B0" stroke-width="1"/>`
};
function svg(key){ return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none">${I[key]}</svg>`; }

// 자주 나오는 메뉴는 전용 그림 아이콘, 나머지는 종류별 태그로 묶음
const POPULAR = [
  [/아메리카노|에스프레소|콜드브루|드립커피|블랙커피/, 'cupDark'],
  [/카페라떼|라떼|카푸치노|바닐라라떼|플랫화이트|모카/, 'cupLight'],
  [/피자/, 'pizza'],
  [/치킨|후라이드|양념치킨/, 'chicken'],
];
const CATEGORY = [
  [/홍차|녹차|둥굴레|유자차|자스민|캐모마일|밀크티|보리차/, 'tea', '차 종류'],
  [/에이드|레몬에이드|자몽에이드|청포도에이드|스무디|주스/, 'citrus', '에이드 종류'],
  [/맥주|소주|하이볼|와인|막걸리|술/, 'drink', '주류'],
  [/케이크|디저트|마카롱|쿠키|와플|빙수/, 'dessert', '디저트'],
  [/삼겹살|고기|구이|족발|보쌈|갈비/, 'meat', '고기 종류'],
  [/짜장면|짬뽕|탕수육|라면|김밥|떡볶이|우동|국수/, 'noodle', '분식·면 종류'],
];
function getMenuVisual(item){
  for(const [re, key] of POPULAR){ if(re.test(item)) return {icon:key, tag:null}; }
  for(const [re, key, tag] of CATEGORY){ if(re.test(item)) return {icon:key, tag}; }
  return {icon:'plate', tag:'기타'};
}

// ---------- speech ----------
const speechSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function getRecognizer(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R) return null;
  const r = new R();
  r.lang = 'ko-KR'; r.interimResults = false; r.maxAlternatives = 1;
  return r;
}
function setMicUI(listening, status, sub){
  document.getElementById('micBtn').classList.toggle('listening', listening);
  document.getElementById('micStatus').textContent = status;
  document.getElementById('micSub').textContent = sub || '';
}

let recog = null, running = false, pendingTimer = null;

function startFlow(){
  if(running){ stopFlow(); return; }
  if(!speechSupported){
    setMicUI(false, '이 브라우저는 음성 인식을 지원하지 않아요', '아래 "직접 입력"을 이용해주세요');
    return;
  }
  recog = getRecognizer();
  recog.continuous = true;
  recog.interimResults = true;
  running = true;
  setMicUI(true, '듣는 중 — 한 명씩 말하고 폰을 넘기세요', '예: "김철수 아이스 아메리카노"');

  recog.onresult = (e)=>{
    let interim = '', fin = '';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) fin += t; else interim += t;
    }
    if(interim) document.getElementById('micSub').textContent = interim;
    if(fin.trim()){
      clearTimeout(pendingTimer);
      const text = fin.trim();
      pendingTimer = setTimeout(()=>{
        const {name, item} = splitNameAndItem(text);
        if(!item) return;
        addOrder(name || '손님' + (orders.length+1), item);
        setMicUI(true, '담았어요 — 다음 분!', (name?name+' · ':'') + item);
      }, 800);
    }
  };
  recog.onerror = (e)=>{
    if(e.error === 'not-allowed'){ running=false; setMicUI(false,'마이크 권한을 허용해주세요',''); }
  };
  recog.onend = ()=>{ if(running){ try{ recog.start(); }catch(err){} } };
  try{ recog.start(); }catch(err){ running=false; setMicUI(false,'다시 눌러주세요',''); }
}

function stopFlow(){
  running = false;
  clearTimeout(pendingTimer);
  if(recog){ try{ recog.stop(); }catch(e){} }
  setMicUI(false, '멈췄어요 — 눌러서 다시 시작', '');
}

function undoLast(){
  if(!orders.length) return;
  orders.sort((a,b)=>a.ts-b.ts).pop();
  saveOrders(); render();
  setMicUI(running, running?'듣는 중 — 다음 분!':'방금 주문을 취소했어요','');
}

function copySummary(){
  if(!orders.length) return;
  const map = new Map();
  orders.forEach(o=>{ const k=normalize(o.item); map.set(k,(map.get(k)||{item:o.item,n:0})); map.get(k).n++; });
  const lines = [...map.values()].sort((a,b)=>b.n-a.n).map(g=>`${g.item} ${g.n}`);
  const txt = lines.join('\n') + `\n— 총 ${orders.length}잔`;
  const done = ()=>{ const b=document.getElementById('copyBtn'); b.textContent='복사됨!'; setTimeout(()=>b.textContent='주문 복사하기',1500); };
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(done, ()=>fallbackCopy(txt,done)); }
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); cb(); }catch(e){} ta.remove();
}

function cancelConfirm(){
  document.getElementById('confirmCard').style.display='none';
  step='idle';
  setMicUI(false, '눌러서 다시 말해주세요', '');
}
function confirmAdd(){
  const name = document.getElementById('cfName').value.trim();
  const item = document.getElementById('cfItem').value.trim();
  if(!name || !item){ return; }
  addOrder(name, item);
  document.getElementById('confirmCard').style.display='none';
  step='idle';
  setMicUI(false, '추가했어요! 다음 사람에게 폰을 건네주세요', '눌러서 계속하기');
}

function addOrder(name, item){
  orders.push({id: Date.now()+Math.random().toString(16).slice(2), name: name.trim(), item: item.trim(), ts: Date.now()});
  saveOrders(); render();
}
function manualAdd(){
  const n = document.getElementById('manualName');
  const i = document.getElementById('manualItem');
  if(!n.value.trim() || !i.value.trim()) return;
  addOrder(n.value, i.value);
  n.value=''; i.value='';
}
function removeOrder(id){ orders = orders.filter(o=>o.id!==id); saveOrders(); render(); }

// ---------- reset ----------
function askReset(){ document.getElementById('overlay').classList.add('show'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function doReset(){ orders=[]; saveOrders(); render(); closeOverlay(); }

// ---------- render ----------
function toggleView(){
  viewMode = viewMode==='grouped' ? 'flat' : 'grouped';
  document.getElementById('viewToggle').textContent = viewMode==='grouped' ? '시간순으로 보기' : '메뉴별로 보기';
  document.getElementById('listLbl').textContent = viewMode==='grouped' ? '메뉴별로 모아보기' : '말한 순서대로';
  render();
}
function normalize(s){ return s.trim().replace(/\s+/g,' ').toLowerCase(); }

function menuCellHtml(item){
  const {icon, tag} = getMenuVisual(item);
  return `
    <div class="menu-cell">
      <div class="menu-icon">${svg(icon)}</div>
      <div>
        <div class="menu-name">${escapeHtml(item)}</div>
        ${tag ? `<span class="cat-tag">${tag}</span>` : ''}
      </div>
    </div>`;
}

function render(){
  document.getElementById('peopleCount').textContent = new Set(orders.map(o=>o.name.trim())).size;
  document.getElementById('orderCount').textContent = orders.length;
  const area = document.getElementById('listArea');
  area.innerHTML = '';

  if(orders.length===0){
    area.innerHTML = '<div class="empty">아직 주문이 없어요.<br>마이크를 눌러 첫 주문을 추가해보세요.</div>';
    return;
  }

  if(viewMode==='flat'){
    const list = document.createElement('div');
    list.className='flat-list';
    [...orders].sort((a,b)=>a.ts-b.ts).forEach(o=>{
      const row = document.createElement('div');
      row.className='flat-row';
      row.innerHTML = `<span class="n">${escapeHtml(o.name)}</span><span class="t">${menuCellHtml(o.item)}</span>`;
      list.appendChild(row);
    });
    area.appendChild(list);
    return;
  }

  const map = new Map();
  orders.forEach(o=>{
    const key = normalize(o.item);
    if(!map.has(key)) map.set(key, {item:o.item, entries:[]});
    map.get(key).entries.push(o);
  });
  const groups = [...map.values()].sort((a,b)=>b.entries.length-a.entries.length);

  const table = document.createElement('table');
  table.className = 'order-table';
  table.innerHTML = `<thead><tr><th>메뉴</th><th>갯수</th><th>주문자</th></tr></thead>`;
  const tbody = document.createElement('tbody');
  groups.forEach(g=>{
    const tr = document.createElement('tr');
    const namesHtml = g.entries.map(e=>
      `<span class="name-chip">${escapeHtml(e.name)}<button data-id="${e.id}">✕</button></span>`
    ).join('');
    tr.innerHTML = `
      <td>${menuCellHtml(g.item)}</td>
      <td><span class="count-badge mono">${g.entries.length}</span></td>
      <td class="names-cell">${namesHtml}</td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  area.appendChild(table);

  table.querySelectorAll('.name-chip button').forEach(btn=>{
    btn.onclick = ()=> removeOrder(btn.dataset.id);
  });
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
